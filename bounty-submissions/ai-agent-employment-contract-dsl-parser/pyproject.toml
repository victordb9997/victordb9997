[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-contract-dsl"
version = "0.1.0"
description = "Parser and validator for AI agent employment contract DSL files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIUNION bounty agent" }]

[project.scripts]
agent-contract-dsl = "agent_contract_dsl.__main__:main"
